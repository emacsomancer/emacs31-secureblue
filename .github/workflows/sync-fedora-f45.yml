name: Sync Fedora F45

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Fedora F45
        run: |
          git remote add fedora \
            https://src.fedoraproject.org/rpms/emacs.git || true
          git fetch fedora f45

      - name: Create sync branch
        run: |
          git checkout secureblue-f45

          if git merge-base --is-ancestor fedora/f45 HEAD; then
            echo "Already up to date"
            exit 0
          fi

          BRANCH="automation/sync-fedora-f45-$(git rev-parse --short fedora/f45)"

          git checkout -b "$BRANCH"
          git merge --no-edit fedora/f45

          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_ENV"

      - name: Create pull request
        if: env.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base secureblue-f45 \
            --head "$branch" \
            --title "Sync Fedora F45 Emacs packaging" \
            --body "Automated sync from Fedora F45."